{% extends "base.html" %}
{% block title %}가입 신청{% endblock %}
{% block body %}
<div class="login-page">
  <a class="login-home-link" href="{{ url_for('auth.login') }}">← 로그인</a>
  <form class="login-card register-card" method="post" action="{{ url_for('auth.register') }}">
    <img class="brand-logo login-brand-logo" src="{{ url_for('static', filename='img/casino-in-logo.png') }}" alt="CASINO IN">
    <p class="login-eyebrow">CASINO IN · ACCOUNT</p>
    <h1 class="login-title">가입 신청</h1>
    <p class="login-subtitle">관리자 승인 후 로그인할 수 있습니다.</p>
    {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="login-label" for="register-username">아이디</label>
    <input class="login-input" type="text" id="register-username" name="username" value="{{ values.username or '' }}" minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]+" autocomplete="username" required autofocus>
    <label class="login-label" for="register-email">이메일</label>
    <input class="login-input" type="email" id="register-email" name="email" value="{{ values.email or '' }}" maxlength="254" autocomplete="email" required>
    <label class="login-label" for="register-password">비밀번호</label>
    <input class="login-input" type="password" id="register-password" name="password" minlength="10" autocomplete="new-password" required>
    <p class="register-help">10자 이상이며 영문·숫자·특수문자를 포함해야 합니다. 비밀번호 원문은 저장되지 않습니다.</p>
    <button class="login-button" type="submit">가입 신청</button>
  </form>
</div>
{% endblock %}
