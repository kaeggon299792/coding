<section
  class="event-horizon-hero home-event-horizon"
  id="event-horizon-hero"
  data-effect-src="{{ url_for('static', filename='hero-effects/event-horizon.html') }}?v=20260807-1"
  aria-labelledby="event-horizon-title"
>
  <div class="event-horizon-visual" data-event-horizon-visual aria-hidden="true"></div>
  <div class="event-horizon-scrim" aria-hidden="true"></div>
  <div class="event-horizon-content">
    <p class="event-horizon-eyebrow">{% if current_locale == 'en' %}CASINO IN / INDUSTRY INTELLIGENCE{% else %}{{ selected_home_tagline[1] }}{% endif %}</p>
    <div class="event-horizon-wordmark" aria-hidden="true">
      <img src="{{ url_for('static', filename='img/casino-in-wordmark-white-smooth.svg') }}" alt="" width="1705" height="350" decoding="async">
    </div>
    <h1 id="event-horizon-title">{{ selected_home_tagline[1] if current_locale == 'en' else selected_home_tagline[0] }}</h1>
    <div class="event-horizon-actions">
      <a class="btn btn-primary" href="{{ url_for('casino_industry_page') }}" data-ui-icon="arrow-right" data-ui-icon-position="end">시장정보 보기</a>
      <a class="btn btn-outline event-horizon-secondary" href="{{ url_for('companies_page') }}" data-ui-icon="arrow-right" data-ui-icon-position="end">기업정보 보기</a>
    </div>
    <p class="event-horizon-note">CASINO IN · INDUSTRY INTELLIGENCE</p>
  </div>
  <p class="event-horizon-status" data-event-horizon-status aria-live="polite"></p>
</section>
