{% extends "base.html" %}
{% block title %}일기 수정{% endblock %}
{% block body %}
{% include "_topbar.html" %}{% include "_board_subnav.html" %}
<main class="page-container diary-page"><header class="page-header"><p class="page-eyebrow">PRIVATE / EDIT</p><h1 class="page-title">일기 수정</h1></header>{% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}<section class="panel"><form method="post" class="diary-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="diary-form-row"><label><span>날짜</span><input type="date" name="diary_date" required value="{{ form_data.diary_date }}"></label><label><span>오늘의 기분</span><select class="diary-mood-select" name="mood_code" required aria-label="오늘의 기분"><option value="" disabled{% if not form_data.mood_code %} selected{% endif %}>기분을 선택하세요</option>{% for code,mood in moods.items() %}<option value="{{ code }}"{% if form_data.mood_code == code %} selected{% endif %}>{{ mood[0] }} {{ mood[1] }}</option>{% endfor %}</select></label></div><label><span>제목</span><input type="text" name="title" maxlength="150" required value="{{ form_data.title }}"></label><label><span>내용</span><textarea id="diary-edit-content" name="content" maxlength="10000" rows="14" required data-image-paste data-image-paste-scope="diary" data-image-paste-endpoint="{{ url_for('upload_diary_image_route') }}" data-image-paste-csrf="{{ csrf_token }}">{{ form_data.content }}</textarea><small class="image-paste-status" data-image-paste-status="diary-edit-content" role="status" aria-live="polite"></small></label><div class="diary-form-footer"><a class="btn" href="{{ url_for('diary_entry_page', entry_id=entry.id) }}">취소</a><button class="btn btn-primary" type="submit">수정 저장</button></div></form></section></main>{% include "_footer.html" %}
{% endblock %}
{% block extra_scripts %}<script src="{{ url_for('static', filename='js/markdown-image-paste.js') }}?v=20260806-diary1" defer></script>{% endblock %}
