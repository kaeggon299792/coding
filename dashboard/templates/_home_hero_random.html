{% set selected_home_tagline = home_hero_taglines | random %}
<script nonce="{{ csp_nonce }}">
(() => {
  const queueKey = "casino-in-home-hero-queue-v2";
  const lastKey = "casino-in-home-hero-last-v2";
  const variants = {{ home_hero_variants | map(attribute='value') | list | tojson }};
  {% set preferred_home_hero = current_user.get('hero_preference') if current_user else none %}
  const preferred = {{ preferred_home_hero | tojson }};
  let selected = variants.includes(preferred) ? preferred : null;

  const randomValue = () => globalThis.crypto?.getRandomValues
    ? globalThis.crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296
    : Math.random();
  const shuffled = () => {
    const values = variants.slice();
    for (let index = values.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(randomValue() * (index + 1));
      [values[index], values[swapIndex]] = [values[swapIndex], values[index]];
    }
    return values;
  };

  if (!selected) {
    let queue = [];
    let last = null;
    try {
      const stored = JSON.parse(sessionStorage.getItem(queueKey) || "[]");
      queue = Array.isArray(stored)
        ? stored.filter((value, index) => variants.includes(value) && stored.indexOf(value) === index)
        : [];
      last = sessionStorage.getItem(lastKey);
    } catch (error) {
      queue = [];
    }
    if (!queue.length) {
      queue = shuffled();
      if (queue.length > 1 && queue[0] === last) {
        [queue[0], queue[1]] = [queue[1], queue[0]];
      }
    }
    selected = queue.shift();
    try {
      sessionStorage.setItem(queueKey, JSON.stringify(queue));
      sessionStorage.setItem(lastKey, selected);
    } catch (error) {}
  }
  window.CasinoHomeHeroSelection = selected;
  document.documentElement.dataset.homeHero = selected;

  const stylesheet = document.createElement("link");
  stylesheet.rel = "stylesheet";
  stylesheet.href = selected === "event-horizon"
    ? "{{ url_for('static', filename='css/event-horizon-hero.css') }}?v=20260808-logo1"
    : selected === "mesh-gradient"
      ? "{{ url_for('static', filename='css/mesh-gradient-hero.css') }}?v=20260808-logo1"
      : "{{ url_for('static', filename='css/casino-wave-webgl.css') }}?v=20260808-mobile-layout2";
  stylesheet.dataset.homeHeroAsset = selected;
  document.head.appendChild(stylesheet);
})();
</script>
<div
  class="home-hero-slot"
  id="home-hero-slot"
  data-three-src="{{ url_for('static', filename='vendor/three/three.r149.min.js') }}"
  data-wave-src="{{ url_for('static', filename='js/casino-wave-webgl-v2.js') }}?v=20260731-lightmotion1"
  data-spotlight-src="{{ url_for('static', filename='js/hero-spotlight.js') }}?v=20260808-random-hero1"
  data-event-horizon-src="{{ url_for('static', filename='js/event-horizon-hero.js') }}?v=20260808-fullbleed4"
  data-mesh-gradient-src="{{ url_for('static', filename='js/mesh-gradient-hero.js') }}?v=20260808-shared2"
>
  <template data-home-hero-template="spotlight">{% include "_hero_spotlight.html" %}</template>
  <template data-home-hero-template="event-horizon">{% include "_hero_event_horizon.html" %}</template>
  <template data-home-hero-template="mesh-gradient">{% include "_hero_mesh_gradient.html" %}</template>
  <noscript>{% include "_hero_spotlight.html" %}</noscript>
</div>
