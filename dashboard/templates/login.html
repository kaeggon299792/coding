{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block body %}
<div class="login-page">
  <form class="login-card" method="post" action="{{ url_for('auth.login') }}">
    <p class="login-eyebrow">SHINGOON · DASHBOARD</p>
    <h1 class="login-title">경영기획 인텔리전스 대시보드</h1>
    <p class="login-subtitle">내부 업무용 시스템입니다</p>
    {% if error %}
      <p class="login-error">{{ error }}</p>
    {% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="login-label" for="username">아이디</label>
    <input class="login-input" type="text" id="username" name="username" autocomplete="username" required autofocus>
    <label class="login-label" for="password">비밀번호</label>
    <input class="login-input" type="password" id="password" name="password" autocomplete="current-password" required>
    <button class="login-button" type="submit">로그인</button>
  </form>
</div>
{% endblock %}
