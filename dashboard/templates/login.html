{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block body %}
<div class="login-page">
  <a class="login-home-link" href="{{ url_for('public_home') }}">← 시작 화면</a>
  <form class="login-card" method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
    <img class="brand-logo login-brand-logo" src="{{ url_for('static', filename='img/casino-in-logo.png') }}" alt="CASINO IN" width="1765" height="410" decoding="async">
    <p class="login-eyebrow">CASINO IN / MANAGEMENT DASHBOARD</p>
    <h1 class="login-title">경영기획 인텔리전스 대시보드</h1>
    <p class="login-subtitle">내부 업무용 시스템입니다</p>
    {% if error %}
      <p class="login-error">{{ error }}</p>
    {% endif %}
    {% if notice %}<p class="account-notice">{{ notice }}</p>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="login-label" for="username">아이디</label>
    <input class="login-input" type="text" id="username" name="username" autocomplete="username" required autofocus>
    <label class="login-label" for="password">비밀번호</label>
    <input class="login-input" type="password" id="password" name="password" autocomplete="current-password" required>
    <button class="login-button" type="submit">로그인</button>
    <a class="register-link" href="{{ url_for('auth.register') }}">계정이 없으신가요? 가입 신청</a>
  </form>
  <form class="test-login-form" method="post" action="{{ url_for('auth.test_login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button class="test-login-button" type="submit"><strong>테스트 계정으로 로그인</strong><span>아이디·비밀번호 입력 없이 둘러보기</span></button>
  </form>
  <div class="test-login-form">
    <a class="test-login-button guest-access-button" href="{{ url_for('public_home') }}"><strong>로그인하지 않고 이용하기</strong><span>공개 메뉴와 대시보드 보기</span></a>
  </div>
</div>
{% endblock %}
