<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>{% block title %}Dashboard{% endblock %} | PARADISE / MANAGEMENT DASHBOARD</title>
<meta name="description" content="PARADISE 경영기획 인텔리전스 대시보드 — 공문·뉴스·실적·공시·법률정보를 한 화면에서.">
<script nonce="{{ csp_nonce }}">
(() => {
  const saved = localStorage.getItem("paradise-theme");
  const theme = saved === "light" || saved === "dark" ? saved : "dark";
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#ffffff" : "#09090b";
})();
</script>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}?v=20260730-government-notices">
{% block extra_head %}{% endblock %}
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite" aria-label="페이지 로딩 중">
  <div class="page-loader-card">
    <div class="page-loader-head"><span class="page-loader-label">PARADISE · Loading</span><span class="page-loader-percent" id="page-loader-percent">0%</span></div>
    <div class="page-loader-track"><div class="page-loader-fill" id="page-loader-fill"></div></div>
  </div>
</div>
{% block body %}{% endblock %}
<button class="theme-toggle" id="theme-toggle" type="button" aria-label="화이트 테마로 변경" aria-pressed="false">
  <span class="theme-toggle-icon" aria-hidden="true">☀</span>
  <span class="theme-toggle-label">WHITE</span>
</button>
<button class="back-to-top" id="back-to-top" type="button" aria-label="맨 위로 이동" hidden>↑</button>
{% include "_legal_footer.html" %}
<script nonce="{{ csp_nonce }}">
(() => {
  const button = document.getElementById("theme-toggle");
  const label = button.querySelector(".theme-toggle-label");
  const icon = button.querySelector(".theme-toggle-icon");
  const apply = (theme) => {
    const isLight = theme === "light";
    document.documentElement.dataset.theme = theme;
    localStorage.setItem("paradise-theme", theme);
    document.querySelector('meta[name="theme-color"]').content = isLight ? "#ffffff" : "#09090b";
    button.setAttribute("aria-pressed", String(isLight));
    button.setAttribute("aria-label", isLight ? "다크 테마로 변경" : "화이트 테마로 변경");
    label.textContent = isLight ? "DARK" : "WHITE";
    icon.textContent = isLight ? "◐" : "☀";
  };
  apply(document.documentElement.dataset.theme || "dark");
  button.addEventListener("click", () => {
    apply(document.documentElement.dataset.theme === "light" ? "dark" : "light");
  });
})();

(() => {
  const button = document.getElementById("back-to-top");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const onScroll = () => {
    if (window.scrollY > 480) {
      button.hidden = false;
      requestAnimationFrame(() => button.classList.add("is-visible"));
    } else {
      button.classList.remove("is-visible");
    }
  };
  window.addEventListener("scroll", onScroll, {passive: true});
  onScroll();
  button.addEventListener("click", () => {
    window.scrollTo({top: 0, behavior: reduceMotion ? "auto" : "smooth"});
  });
})();

(() => {
  const loader = document.getElementById("page-loader");
  const percent = document.getElementById("page-loader-percent");
  const fill = document.getElementById("page-loader-fill");
  let value = 0;
  let timer;
  let safetyTimer;
  const paint = (next) => {
    value = Math.max(0, Math.min(100, Math.round(next)));
    percent.textContent = `${value}%`;
    fill.style.width = `${value}%`;
  };
  const start = (initial = 0, maxWait = 4000) => {
    clearInterval(timer);
    clearTimeout(safetyTimer);
    paint(initial);
    loader.removeAttribute("aria-hidden");
    loader.classList.remove("is-hidden");
    timer = setInterval(() => {
      const step = value < 45 ? 7 : value < 75 ? 3 : value < 92 ? 1 : 0;
      if (step) paint(value + step);
    }, 90);
    // load 이벤트는 느린 이미지·외부 리소스 하나만 있어도 발생하지 않을 수 있다.
    // 콘텐츠가 준비된 뒤 로더가 92%에서 화면을 계속 막지 않도록 안전 종료한다.
    safetyTimer = setTimeout(finish, maxWait);
  };
  function finish() {
    clearInterval(timer);
    clearTimeout(safetyTimer);
    paint(100);
    setTimeout(() => {
      loader.classList.add("is-hidden");
      loader.setAttribute("aria-hidden", "true");
    }, 180);
  }
  start(0);
  document.addEventListener("DOMContentLoaded", () => {
    paint(Math.max(value, 92));
    setTimeout(finish, 240);
  });
  window.addEventListener("load", finish, {once: true});
  window.addEventListener("pageshow", (event) => { if (event.persisted) finish(); });
  document.addEventListener("submit", (event) => {
    start(5, 8000);
    if (event.submitter?.classList.contains("file-download-trigger")) {
      setTimeout(finish, 1200);
    }
  });
  document.addEventListener("click", (event) => {
    const link = event.target.closest("a[href]");
    if (!link || event.defaultPrevented || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    const url = new URL(link.href, location.href);
    if (url.origin === location.origin && !link.hasAttribute("download") && link.target !== "_blank" && url.href !== location.href) {
      start(5, 8000);
      if (link.classList.contains("file-download-trigger")) setTimeout(finish, 1200);
    }
  });
})();
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
